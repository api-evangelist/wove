openapi: 3.2.0
info:
  title: Wove External Query Bank API
  version: 1.0.0
  description: '# Wove External API Documentation


    The Wove External API allows you to programmatically access document processing, shipment management, and validation capabilities.'
  contact:
    name: Wove API Support
    email: api-support@wove.com
    url: https://docs.wove.com
  license:
    name: Proprietary
    url: https://wove.com/terms
servers:
- url: https://api.wove.com
  description: Production server
- url: https://staging-api.wove.com
  description: Staging server
- url: http://localhost:4000
  description: Development server
security:
- bearerAuth: []
tags:
- name: Query Bank
  description: Query Bank management - add/remove sources from your rate query pool
paths:
  /api/v1/external/query-bank/sources:
    get:
      tags:
      - Query Bank
      summary: List Query Bank sources
      description: 'Returns all sources currently linked to your Query Bank.


        The Query Bank is a collection of rate sources used when querying for rates.

        Only sources with status "complete" can be added to the Query Bank.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Query Bank sources retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      sources:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExternalQueryBankSource'
              example:
                success: true
                data:
                  sources:
                  - id: '9876543210987654321'
                    sourceId: '1234567890123456789'
                    filename: carrier_rates_2024.xlsx
                    carrierId: '123456789'
                    carrierName: Maersk
                    effectiveDate: '2024-01-01'
                    expiryDate: '2024-12-31'
                    linkedAt: '2024-01-15T11:00:00.000Z'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getApiV1ExternalQueryBankSources
      x-operation-id-source: derived
    post:
      tags:
      - Query Bank
      summary: Add source to Query Bank
      description: 'Links a processed source to your Query Bank, making its rates available for querying.


        **Requirements**:

        - Source must exist and belong to your organization

        - Source must have status "complete"

        - Source cannot already be in the Query Bank'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSourceToQueryBankRequest'
            example:
              sourceId: '1234567890123456789'
      responses:
        '201':
          description: Source added to Query Bank successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AddSourceToQueryBankResponse'
              example:
                success: true
                data:
                  sourceId: '1234567890123456789'
                  linkedAt: '2024-01-15T11:00:00.000Z'
        '400':
          description: Source not eligible (not complete, already in Query Bank)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postApiV1ExternalQueryBankSources
      x-operation-id-source: derived
  /api/v1/external/query-bank/sources/{sourceId}:
    delete:
      tags:
      - Query Bank
      summary: Remove source from Query Bank
      description: 'Unlinks a source from your Query Bank. The source will no longer be included in rate queries.


        This does not delete the source itself - it only removes it from the Query Bank.'
      security:
      - bearerAuth: []
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
        description: The source ID to remove from Query Bank
        example: '1234567890123456789'
      responses:
        '200':
          description: Source removed from Query Bank successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/RemoveSourceFromQueryBankResponse'
              example:
                success: true
                data:
                  sourceId: '1234567890123456789'
                  unlinkedAt: '2024-01-15T12:00:00.000Z'
        '404':
          description: Source not found in Query Bank
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: deleteApiV1ExternalQueryBankSourcesBySourceId
      x-operation-id-source: derived
components:
  schemas:
    AddSourceToQueryBankResponse:
      type: object
      properties:
        sourceId:
          type: string
        linkedAt:
          type: string
          format: date-time
      required:
      - sourceId
      - linkedAt
    RemoveSourceFromQueryBankResponse:
      type: object
      properties:
        sourceId:
          type: string
        unlinkedAt:
          type: string
          format: date-time
      required:
      - sourceId
      - unlinkedAt
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid input parameters
            details:
              type: object
              description: Additional error context
      required:
      - success
      - error
    AddSourceToQueryBankRequest:
      type: object
      properties:
        sourceId:
          type: string
          description: The source ID to add to Query Bank
      required:
      - sourceId
    ExternalQueryBankSource:
      type: object
      properties:
        id:
          type: string
          description: Query Bank entry ID
        sourceId:
          type: string
          description: The linked source ID
        filename:
          type: string
          description: Source filename
        carrierId:
          type: string
        carrierName:
          type: string
        sourceType:
          type: string
        rateCount:
          type: integer
        effectiveDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        linkedAt:
          type: string
          format: date-time
          description: When the source was added to Query Bank
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 Bearer token obtained from /auth/token endpoint
