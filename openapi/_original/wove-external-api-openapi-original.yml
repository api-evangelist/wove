          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Query Bank Endpoints
  /api/v1/external/query-bank/sources:
    get:
      tags: [Query Bank]
      summary: List Query Bank sources
      description: |
        Returns all sources currently linked to your Query Bank.

        The Query Bank is a collection of rate sources used when querying for rates.
        Only sources with status "complete" can be added to the Query Bank.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Query Bank sources retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      sources:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExternalQueryBankSource'
              example:
                success: true
                data:
                  sources:
                    - id: '9876543210987654321'
                      sourceId: '1234567890123456789'
                      filename: carrier_rates_2024.xlsx
                      carrierId: '123456789'
                      carrierName: 'Maersk'
                      effectiveDate: '2024-01-01'
                      expiryDate: '2024-12-31'
                      linkedAt: '2024-01-15T11:00:00.000Z'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Query Bank]
      summary: Add source to Query Bank
      description: |
        Links a processed source to your Query Bank, making its rates available for querying.

        **Requirements**:
        - Source must exist and belong to your organization
        - Source must have status "complete"
        - Source cannot already be in the Query Bank
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSourceToQueryBankRequest'
            example:
              sourceId: '1234567890123456789'
      responses:
        '201':
          description: Source added to Query Bank successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AddSourceToQueryBankResponse'
              example:
                success: true
                data:
                  sourceId: '1234567890123456789'
                  linkedAt: '2024-01-15T11:00:00.000Z'
        '400':
          description: Source not eligible (not complete, already in Query Bank)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/query-bank/sources/{sourceId}:
    delete:
      tags: [Query Bank]
      summary: Remove source from Query Bank
      description: |
        Unlinks a source from your Query Bank. The source will no longer be included in rate queries.

        This does not delete the source itself - it only removes it from the Query Bank.
      security:
        - bearerAuth: []
      parameters:
        - name: sourceId
          in: path
          required: true
