openapi: 3.1.0
info:
  title: Wove External API
  version: 1.0.0
  description: |
    # Wove External API Documentation

    The Wove External API allows you to programmatically access document processing, shipment management, and validation capabilities.

    ## Features

    - **OAuth 2.0 Authentication**: Secure client credentials flow
    - **Rate Limiting**: Configurable per-client rate limits
    - **Document Processing**: Upload, validate, and merge shipping documents
    - **Shipment Management**: Create and manage shipment records with validation and merge operations
    - **Webhooks**: Get notified of document processing events (extraction, validation, merge)
    - **Comprehensive Error Handling**: Detailed error responses with troubleshooting information

    ## Getting Started

    1. **Create OAuth Client**: Contact your account manager to create OAuth credentials
    2. **Get Access Token**: Use client credentials flow to obtain bearer token
    3. **Make API Calls**: Include bearer token in Authorization header
    4. **Handle Rate Limits**: Monitor rate limit headers in responses

    ## Authentication

    All API endpoints require OAuth 2.0 authentication using the client credentials flow.

    ### Getting an Access Token

    ```bash
    curl -X POST https://api.wove.com/api/v1/external/auth/token \
      -H "Content-Type: application/json" \
      -d '{
        "grant_type": "client_credentials",
        "client_id": "your_client_id",
        "client_secret": "your_client_secret"
      }'
    ```

    ### Using the Access Token

    Include the access token in the Authorization header:

    ```bash
    curl -H "Authorization: Bearer your_access_token" \
      https://api.wove.com/api/v1/external/shipments
    ```

    ## Rate Limiting

    All endpoints are subject to rate limiting based on your OAuth client configuration:

    - **Per-minute limit**: Default 60 requests/minute
    - **Daily limit**: Default 10,000 requests/day

    Rate limit information is included in response headers:
    - `X-RateLimit-Limit-Minute`: Your per-minute limit
    - `X-RateLimit-Remaining-Minute`: Remaining requests this minute
    - `X-RateLimit-Reset-Minute`: When the minute window resets
    - `X-RateLimit-Limit-Day`: Your daily limit
    - `X-RateLimit-Remaining-Day`: Remaining requests today
    - `X-RateLimit-Reset-Day`: When the daily window resets

    ## Webhook Security

    All webhook payloads are signed using HMAC-SHA256 for verification:

    ```javascript
    // Verify webhook signature
    const crypto = require('crypto');
    const signature = request.headers['x-wove-signature'];
    const payload = JSON.stringify(request.body);
    const expectedSignature = crypto
      .createHmac('sha256', your_webhook_secret)
      .update(payload)
      .digest('hex');

    const isValid = crypto.timingSafeEqual(
      Buffer.from(signature),
      Buffer.from(expectedSignature)
    );
    ```

    Headers included with every webhook:
    - `X-Wove-Signature`: HMAC-SHA256 signature of the payload
    - `X-Wove-Event`: Event type (e.g., "extraction.completed")
    - `X-Wove-Timestamp`: ISO timestamp when the webhook was sent

    ## Error Handling

    All errors follow a consistent format:

    ```json
    {
      "success": false,
      "error": {
        "code": "VALIDATION_ERROR",
        "message": "One or more documents not found or access denied",
        "details": {
          "field": "documentIds",
          "value": ["invalid_id"]
        }
      }
    }
    ```

    ### Error Codes

    - `VALIDATION_ERROR` - Invalid request parameters or data validation failure
    - `AUTHENTICATION_ERROR` - Invalid or expired credentials
    - `AUTHORIZATION_ERROR` - Insufficient permissions for the requested operation
    - `NOT_FOUND` - Requested resource not found
    - `RATE_LIMIT_ERROR` - Too many requests, rate limit exceeded
    - `INTERNAL_ERROR` - Internal server error

    See the common error responses in the components section for detailed examples.

  contact:
    name: Wove API Support
    email: api-support@wove.com
    url: https://docs.wove.com
  license:
    name: Proprietary
    url: https://wove.com/terms

servers:
  - url: https://api.wove.com
    description: Production server
  - url: https://staging-api.wove.com
    description: Staging server
  - url: http://localhost:4000
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 Bearer token obtained from /auth/token endpoint

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Response data (varies by endpoint)
        message:
          type: string
          description: Optional success message
      required: [success, data]

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid input parameters
            details:
              type: object
              description: Additional error context
      required: [success, error]

    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            description: Array of items (varies by endpoint)
        message:
          type: string
          description: Optional success message
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 150
            totalPages:
              type: integer
              example: 8
            hasNext:
              type: boolean
              example: true
            hasPrev:
              type: boolean
              example: false
          required: [page, limit, total, totalPages, hasNext, hasPrev]
      required: [success, data, pagination]

    TokenRequest:
      type: object
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
          example: client_credentials
        client_id:
          type: string
          example: wove_prod_abc123...
        client_secret:
          type: string
          example: sk_...
        scope:
          type: string
          description: Space-separated list of scopes
          example: shipments:read documents:read validation:create
      required: [grant_type, client_id, client_secret]

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
          description: Token lifetime in seconds
        scope:
          type: string
          example: shipments:read documents:read validation:create

    PortLocation:
      type: object
      properties:
        portCode:
          type: string
          example: USLAX
        portName:
          type: string
          example: Los Angeles
        countryCode:
          type: string
          example: US
      required: [portCode]

    AirportLocation:
      type: object
      properties:
        airportCode:
          type: string
          example: LAX
        airportName:
          type: string
          example: Los Angeles International Airport
        countryCode:
          type: string
          example: US
      required: [airportCode]

    AddressLocation:
      type: object
      properties:
        address1:
          type: string
          example: 123 Main St
        address2:
          type: string
          example: Suite 100
        city:
          type: string
          example: New York
        province:
          type: string
          example: NY
        postalCode:
          type: string
          example: '10001'
        country:
          type: string
          example: US

    Location:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum: [Port]
            portCode:
              type: string
              example: USNYC
            portName:
              type: string
              example: New York/Newark
            countryCode:
              type: string
              example: US
          required: [type, portCode]
        - type: object
          properties:
            type:
              type: string
              enum: [Airport]
            airportCode:
              type: string
              example: JFK
            airportName:
              type: string
              example: John F. Kennedy International Airport
            countryCode:
              type: string
              example: US
          required: [type, airportCode]
        - type: object
          properties:
            type:
              type: string
              enum: [Door]
            address1:
              type: string
              example: 123 Main St
            address2:
              type: string
              example: Suite 100
            city:
              type: string
              example: New York
            province:
              type: string
              example: NY
            postalCode:
              type: string
              example: '10001'
            country:
              type: string
              example: US
          required: [type, address1, city, country]

    ReferenceNumber:
      type: object
      properties:
        id:
          type: string
          example: '1014810279825727493'
        type:
          type: string
          example: booking
          description: Type of reference number (booking, invoice, po, etc.)
        displayNumber:
          type: string
          example: BOOK-2024-001
        cleanedNumber:
          type: string
          example: BOOK2024001
          description: Cleaned version without special characters
      required: [id, type, displayNumber]

    ShipmentSummary:
      type: object
      properties:
        id:
          type: string
          example: '1014810279825727490'
        status:
          type: string
          enum: [draft, pending, booked, in_transit, delivered, cancelled]
          example: draft
          description: Current status of the shipment
        name:
          type: string
          example: External API Test Shipment
        shipmentType:
          type: string
          enum: [FCL, LCL, AIR, LTL, FTL, RAIL]
          example: LCL
        commodity:
          type: string
          example: Electronics
        portOfLoading:
          $ref: '#/components/schemas/PortLocation'
        portOfDischarge:
          $ref: '#/components/schemas/PortLocation'
        placeOfReceiptType:
          type: string
          enum: [Port, Airport, Door]
        placeOfReceiptPort:
          $ref: '#/components/schemas/PortLocation'
        placeOfReceiptAirport:
          $ref: '#/components/schemas/AirportLocation'
        placeOfReceiptAddress:
          $ref: '#/components/schemas/AddressLocation'
        placeOfDeliveryType:
          type: string
          enum: [Port, Airport, Door]
        placeOfDeliveryPort:
          $ref: '#/components/schemas/PortLocation'
        placeOfDeliveryAirport:
          $ref: '#/components/schemas/AirportLocation'
        placeOfDeliveryAddress:
          $ref: '#/components/schemas/AddressLocation'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        documentCount:
          type: integer
          example: 5
          description: Number of documents attached to this shipment

    ShipmentCarrier:
      type: object
      properties:
        code:
          type: string
          example: MAEU
        name:
          type: string
          example: Maersk Line
      required: [code, name]

    # Backwards compatibility alias
    Carrier:
      $ref: '#/components/schemas/ShipmentCarrier'

    ShipmentDetails:
      allOf:
        - $ref: '#/components/schemas/ShipmentSummary'
        - type: object
          properties:
            carrier:
              $ref: '#/components/schemas/Carrier'
            vessel:
              type: string
              example: MSC OSCAR
            voyage:
              type: string
              example: 123W
            incoterm:
              type: string
              example: FOB
            serviceType:
              type: string
              example: CY-CY
            invoiceDate:
              type: string
              format: date-time
            dueDate:
              type: string
              format: date-time
            issueDate:
              type: string
              format: date-time
            shipmentDate:
              type: string
              format: date-time
            expectedDeliveryDate:
              type: string
              format: date-time
            readyDate:
              type: string
              format: date-time
            dateOfSignature:
              type: string
              format: date-time
            referenceNumbers:
              type: array
              items:
                $ref: '#/components/schemas/ReferenceNumber'
            # Party fields - Consignee
            consigneeName:
              $ref: '#/components/schemas/Organization'
            consigneeAddress:
              $ref: '#/components/schemas/Address'
            consigneeContactName:
              type: string
              nullable: true
            consigneeContactPhone:
              type: string
              nullable: true
            consigneeContactEmail:
              type: string
              nullable: true
            # Party fields - Consignor
            consignorName:
              $ref: '#/components/schemas/Organization'
            consignorAddress:
              $ref: '#/components/schemas/Address'
            consignorContactName:
              type: string
              nullable: true
            consignorContactPhone:
              type: string
              nullable: true
            consignorContactEmail:
              type: string
              nullable: true
            # Party fields - Notify Party
            notifyPartyName:
              $ref: '#/components/schemas/Organization'
            notifyPartyAddress:
              $ref: '#/components/schemas/Address'
            notifyPartyContactName:
              type: string
              nullable: true
            notifyPartyContactPhone:
              type: string
              nullable: true
            notifyPartyContactEmail:
              type: string
              nullable: true
            # Party fields - Destination Agent
            destinationAgentName:
              $ref: '#/components/schemas/Organization'
            destinationAgentAddress:
              $ref: '#/components/schemas/Address'
            destinationAgentContactName:
              type: string
              nullable: true
            destinationAgentContactPhone:
              type: string
              nullable: true
            destinationAgentContactEmail:
              type: string
              nullable: true
            # Weight and volume fields
            totalWeight:
              type: number
              nullable: true
            weightUnit:
              type: string
              nullable: true
            totalVolume:
              type: number
              nullable: true
            volumeUnit:
              type: string
              nullable: true
            totalPieces:
              type: number
              nullable: true
            # Aggregate package fields
            totalPacks:
              type: number
              nullable: true
            totalPacksPackageType:
              type: string
              nullable: true
            # Total value fields
            totalValue:
              type: number
              nullable: true
            currency:
              type: string
              nullable: true

    ShipmentItem:
      type: object
      properties:
        id:
          type: string
          example: '1014810279825727491'
        lineNumber:
          type: integer
          example: 1
        sku:
          type: string
          example: SKU-12345
        partNumber:
          type: string
          example: PN-67890
        description:
          type: string
          example: Electronic Component
        quantity:
          type: number
          example: 100
        unitOfMeasure:
          type: string
          example: PCS
        unitPrice:
          type: number
          example: 25.50
        amount:
          type: number
          example: 2550.00
        currency:
          type: string
          example: USD
        countryOfOrigin:
          type: string
          example: CN
        hsCode:
          type: string
          example: '8541.10.00'
        weight:
          type: number
          example: 150.5
        weightUnit:
          type: string
          example: KG
        volume:
          type: number
          example: 2.5
        volumeUnit:
          type: string
          example: CBM
        packageNumber:
          type: string
          example: PKG-001
        dimensions:
          type: object
          properties:
            length:
              type: number
              example: 100
            width:
              type: number
              example: 50
            height:
              type: number
              example: 50
            unit:
              type: string
              example: CM

    ShipmentContainer:
      type: object
      properties:
        id:
          type: string
          example: '1014810279825727492'
        number:
          type: string
          example: MSKU1234567
        size:
          type: string
          example: '40'
        type:
          type: string
          example: HC
        sizeType:
          type: string
          example: 40HC
          description: Combined size and type (e.g., 20GP, 40HC)
        sealNumber:
          type: string
          example: SEAL123456
        quantity:
          type: integer
          example: 1
        packages:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentPackage'
          description: Packages contained in this container

    # Backwards compatibility alias
    Container:
      $ref: '#/components/schemas/ShipmentContainer'

    ShipmentPackage:
      type: object
      properties:
        id:
          type: string
          example: '1014810279825727493'
        containerId:
          type: string
          nullable: true
          description: ID of the container this package belongs to (null for loose packages)
        packageNumber:
          type: string
          example: PKG001
        packageType:
          type: string
          example: CARTON
        description:
          type: string
          nullable: true
        packageCount:
          type: integer
          example: 1
        lineNumber:
          type: integer
          nullable: true
        grossWeight:
          type: number
          nullable: true
        netWeight:
          type: number
          nullable: true
        volume:
          type: number
          nullable: true
        weightUnit:
          type: string
          nullable: true
        volumeUnit:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentItem'
          description: Items contained in this package

    ShipmentEvent:
      type: object
      properties:
        id:
          type: string
          example: '1014810279825727495'
        eventType:
          type: string
          example: status_change
        eventDate:
          type: string
          format: date-time
        eventLocation:
          type: string
          example: USLAX
        eventDescription:
          type: string
          example: Status changed from draft to booked
        createdAt:
          type: string
          format: date-time

    CreateShipmentRequest:
      type: object
      properties:
        name:
          type: string
          example: My Shipment
        shipmentType:
          type: string
          enum: [FCL, LCL, AIR, LTL, FTL, RAIL]
          example: FCL
        commodity:
          type: string
          example: Electronics
        carrier:
          type: string
          example: MSC
        vessel:
          type: string
          example: MSC OSCAR
        voyage:
          type: string
          example: 123E
        incoterm:
          type: string
          example: FOB
        serviceType:
          type: string
          example: CY/CY
        portOfLoading:
          type: string
          example: CNSHA
        portOfDischarge:
          type: string
          example: USLAX
        placeOfReceipt:
          $ref: '#/components/schemas/Location'
        placeOfDelivery:
          $ref: '#/components/schemas/Location'
        referenceNumbers:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceNumber'
        customFields:
          type: object
          additionalProperties: true
      required: [name]

    UpdateShipmentRequest:
      allOf:
        - $ref: '#/components/schemas/CreateShipmentRequest'
        - type: object
          description: All fields from CreateShipmentRequest are optional for updates

    Document:
      type: object
      properties:
        id:
          type: string
          example: '1013737064058920960'
        entityId:
          type: string
          example: '1014810279825727490'
        entityType:
          type: string
          example: shipment
        type:
          type: string
          example: CommercialInvoice
        name:
          type: string
          example: commercial_invoice.pdf
        size:
          type: integer
          example: 1024000
        checksum:
          type: string
          example: 'a1b2c3d4e5f6...'
        isSelected:
          type: boolean
          example: true
        extractedData:
          type: object
          description: Extracted data from the document
          additionalProperties: true
        extractionStatus:
          type: string
          enum: [pending, processing, completed, failed]
          example: completed
        extractionError:
          type: string
          example: null
        extractedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ValidationRequest:
      type: object
      properties:
        documentIds:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 20
          example: ['1013737064058920960', '1013737064063115265']
        ruleSetId:
          type: string
          description: Optional validation rule set ID
        async:
          type: boolean
          description: Process validation asynchronously
          default: false
        webhookUrl:
          type: string
          format: uri
          description: Webhook URL for async processing notifications
      required: [documentIds]

    ValidationJobResponse:
      type: object
      properties:
        jobId:
          type: string
          example: '1014851234567890123'
        status:
          type: string
          enum: [pending, processing, completed, failed]
          example: pending
        message:
          type: string
          example: Validation job created. Use the job ID to check status.

    ValidationResult:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        result:
          type: object
          properties:
            status:
              type: string
              enum: [valid, warnings, errors]
            issues:
              type: array
              items:
                type: object
                properties:
                  severity:
                    type: string
                    enum: [error, warning, info]
                  field:
                    type: string
                  message:
                    type: string
                  documents:
                    type: object
                    additionalProperties: true

    MergeJobResponse:
      type: object
      properties:
        jobId:
          type: string
          example: '1014851234567890123'
        status:
          type: string
          enum: [pending, processing, completed, failed]
          example: pending
        documentIds:
          type: array
          items:
            type: string
        message:
          type: string
          example: Merge job created. Use the job ID to check status.

    MergeResult:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        result:
          type: object
          properties:
            mergedData:
              type: object
              additionalProperties: true
            conflicts:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  values:
                    type: object
                    additionalProperties: true
                  resolution:
                    type: string

    Webhook:
      type: object
      properties:
        id:
          type: string
          example: '1014560123456789012'
        url:
          type: string
          format: uri
          example: https://your-app.com/webhook
        events:
          type: array
          items:
            type: string
            enum:
              - extraction.completed
              - extraction.failed
              - validation.completed
              - validation.failed
              - merge.completed
              - merge.failed
              - document.uploaded
              - document.deleted
              - shipment.created
              - shipment.updated
              - source.processing.completed
              - source.processing.failed
              - webhook.test
        description:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastTriggeredAt:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: HTTPS URL to receive webhook notifications
        events:
          type: array
          items:
            type: string
            enum:
              - extraction.completed
              - extraction.failed
              - validation.completed
              - validation.failed
              - merge.completed
              - merge.failed
              - document.uploaded
              - document.deleted
              - shipment.created
              - shipment.updated
              - source.processing.completed
              - source.processing.failed
              - webhook.test
          minItems: 1
        description:
          type: string
      required: [url, events]

    WebhookPayload:
      type: object
      description: Standard wrapper for all webhook payloads
      properties:
        event:
          type: string
          description: The event type that triggered this webhook
          example: extraction.completed
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the webhook was sent
        data:
          type: object
          description: Event-specific data payload
      required: [event, timestamp, data]

    WebhookDocument:
      type: object
      description: Document object included in webhook payloads
      properties:
        id:
          type: string
          example: '1014560123456789012'
        type:
          type: string
          example: CommercialInvoice
        name:
          type: string
          example: invoice_2024_001.pdf
        size:
          type: integer
          example: 245678
        checksum:
          type: string
          example: '1234567890123456'
        isSelected:
          type: boolean
        extractedData:
          type: object
          nullable: true
          description: The extracted JSON data (null if not extracted)
        extractionStatus:
          type: string
          enum: [pending, processing, completed, failed]
        extractionError:
          type: string
          nullable: true
        extractedAt:
          type: string
          format: date-time
          nullable: true
        mimeType:
          type: string
          example: application/pdf
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ExtractionCompletedPayload:
      type: object
      properties:
        document:
          $ref: '#/components/schemas/WebhookDocument'
        entityType:
          type: string
