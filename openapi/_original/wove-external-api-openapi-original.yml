  /api/v1/external/documents/guess-type:
    post:
      tags: [Documents]
      summary: Guess document type
      description: |
        Intelligently guess the type of a document based on its filename and optionally its content.
        Uses AI-powered detection to analyze filename patterns and file content for accurate type identification.

        **File size limit**: 50MB when uploading file content

        **Supported file types for content analysis**:
        - Images (JPEG, PNG, etc.)
        - PDFs
        - Spreadsheets (Excel, CSV)
        - Word documents (DOCX)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fileName:
                  type: string
                  description: The name of the file to analyze
                  example: Packing_List_ABC.xlsx
                file:
                  type: string
                  format: binary
                  description: Optional file content for more accurate type detection
              required: [fileName]
      responses:
        '200':
          description: Document type guessed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      documentType:
                        type: string
                        description: The detected document type
                        enum:
                          - CommercialInvoice
                          - PackingList
                          - BillOfLading
                          - AirWaybill
                          - CertificateOfOrigin
                          - DangerousGoodsDeclaration
                          - InsuranceCertificate
                          - SafetyDataSheet
                          - BookingConfirmation
                          - APInvoice
                          - ARInvoice
                          - PaymentConfirmation
                          - ISFFiling
                          - Other
                        example: CommercialInvoice
                      confidence:
                        type: string
                        description: Confidence level of the detection
                        enum: [high, low]
                        example: high
                      fileName:
                        type: string
                        description: The analyzed filename
                        example: Commercial_Invoice_123.pdf
                      fileAnalyzed:
                        type: boolean
                        description: Whether file content was analyzed (in addition to filename)
                        example: false
              example:
                success: true
                data:
                  documentType: CommercialInvoice
                  confidence: high
                  fileName: Commercial_Invoice_123.pdf
                  fileAnalyzed: false
        '400':
          description: Bad request - missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: BAD_REQUEST
                  message: fileName is required
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: FORBIDDEN
                  message: 'Insufficient scope: documents:read required'

  # Sources Endpoints
  /api/v1/external/sources/upload:
    post:
      tags: [Sources]
      summary: Get presigned URL for source upload
      description: |
        Creates a new source record and returns a presigned URL for uploading a rate sheet file.

        **Workflow**:
        1. Call this endpoint with file metadata
        2. Upload the file directly to the returned presigned URL using PUT
        3. Call POST /sources/{sourceId}/process to start processing

        **Supported file types**: Excel (.xlsx, .xls), CSV, PDF

        **File size limit**: 50MB
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceUploadRequest'
            example:
              filename: carrier_rates_2024.xlsx
              contentType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
              sourceType: contract
              carrierId: '123456789'
              effectiveDate: '2024-01-01'
              expiryDate: '2024-12-31'
              description: Q1 2024 contract rates from carrier
      responses:
        '201':
          description: Source created successfully with upload URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CreateSourceUploadResponse'
              example:
                success: true
                data:
                  sourceId: '1234567890123456789'
                  uploadUrl: 'https://s3.amazonaws.com/bucket/path?signature=...'
                  expiresAt: '2024-01-15T12:30:00.000Z'
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions - requires sources:write scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/sources/{sourceId}/process:
    post:
      tags: [Sources]
      summary: Start processing an uploaded source
      description: |
        Initiates processing of a source file after it has been uploaded to the presigned URL.

        The source will be queued for processing and its status will transition through:
        - `pending` → `processing` → `complete` or `failed`

        Use GET /sources/{sourceId} to monitor processing status.
        Configure webhooks to receive notifications when processing completes.
      security:
        - bearerAuth: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
          description: The source ID returned from the upload endpoint
          example: '1234567890123456789'
      responses:
        '200':
          description: Processing started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProcessSourceResponse'
              example:
                success: true
                data:
                  sourceId: '1234567890123456789'
                  status: pending
                  message: 'Source queued for processing'
        '400':
          description: Source not ready for processing (not uploaded yet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/sources:
    get:
      tags: [Sources]
      summary: List all sources
      description: |
        Returns a paginated list of all rate sheet sources for your organization.

        Sources can be filtered by status and sorted by various fields.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [awaiting_upload, pending, processing, complete, failed]
          description: Filter by processing status
        - name: carrierId
          in: query
          schema:
            type: string
          description: Filter by carrier ID
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Number of results to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of results to skip
      responses:
        '200':
          description: Sources retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      sources:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExternalSourceSummary'
                      total:
                        type: integer
                        description: Total number of sources matching the filter
              example:
                success: true
                data:
                  sources:
                    - id: '1234567890123456789'
                      filename: carrier_rates_2024.xlsx
                      status: complete
                      sourceType: contract
                      carrierId: '123456789'
                      carrierName: 'Maersk'
                      rateCount: 1250
                      effectiveDate: '2024-01-01'
                      expiryDate: '2024-12-31'
                      createdAt: '2024-01-15T10:00:00.000Z'
                      processedAt: '2024-01-15T10:05:00.000Z'
                  total: 1
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/sources/{sourceId}:
    get:
      tags: [Sources]
