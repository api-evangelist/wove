  /api/v1/external/shipments/{shipmentId}/documents/analyze-types:
    post:
      tags: [Documents]
      summary: Analyze document types
      description: |
        Analyze a document to detect multiple document types within it.
        For PDFs, this will identify different document types and their page boundaries.
        For other file types, it will identify the document type based on content.
      security:
        - bearerAuth: []
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
          description: Unique shipment identifier
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The document file to analyze
              required: [file]
      responses:
        '200':
          description: Document analysis completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      types:
                        type: array
                        description: Array of detected document types and their boundaries
                        items:
                          type: object
                          properties:
                            documentType:
                              type: string
                              description: Type of document detected
                              enum:
                                [
                                  CommercialInvoice,
                                  PackingList,
                                  BillOfLading,
                                  AirWaybill,
                                  CertificateOfOrigin,
                                  DangerousGoodsDeclaration,
                                  Other,
                                ]
                            startPage:
                              type: integer
                              nullable: true
                              description: Starting page number (1-indexed) for PDFs
                            endPage:
                              type: integer
                              nullable: true
                              description: Ending page number (1-indexed) for PDFs
                            confidence:
                              type: string
                              enum: [high, medium, low]
                              description: Confidence level of the detection
                      totalPages:
                        type: integer
                        description: Total number of pages in the document (for PDFs)
                      requiresSplit:
                        type: boolean
                        description: Whether the document contains multiple types requiring split
        '400':
          description: Invalid file or request
        '404':
          description: Shipment not found
        '413':
          description: File too large

  /api/v1/external/shipments/{shipmentId}/documents/upload-multi:
    post:
      tags: [Documents]
      summary: Upload multi-document file
      description: |
        Upload a file containing multiple documents.
        For PDFs with multiple document types, this will create separate document records for each type.
        The original file is stored once, with virtual splits created for each document type.
      security:
        - bearerAuth: []
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
          description: Unique shipment identifier
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The document file to upload
                types:
                  type: string
                  description: JSON string containing array of document types with page ranges
                  example: '[{"documentType":"BillOfLading","startPage":1,"endPage":2},{"documentType":"CommercialInvoice","startPage":3,"endPage":4}]'
              required: [file, types]
      responses:
        '200':
          description: Documents uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      documents:
                        type: array
                        description: Array of created document records
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Document ID
                            type:
                              type: string
                              description: Document type
                            name:
                              type: string
                              description: Generated document name
                            startPage:
                              type: integer
                              nullable: true
                              description: Start page for split documents
                            endPage:
                              type: integer
                              nullable: true
                              description: End page for split documents
                            isSplit:
                              type: boolean
                              description: Whether this is a split document
        '400':
          description: Invalid file or types specification
        '404':
          description: Shipment not found
        '413':
          description: File too large

