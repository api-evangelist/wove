security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: OAuth 2.0 authentication endpoints
  - name: Testing
    description: Test endpoints for API validation
  - name: Shipments
    description: Shipment management operations
  - name: Documents
    description: Document management within shipments
  - name: Webhooks
    description: Webhook management for async notifications
  - name: Sources
    description: Rate sheet source management - upload, process, and query status
  - name: Query Bank
    description: Query Bank management - add/remove sources from your rate query pool
  - name: Rates
    description: Query freight rates from your Query Bank
  - name: Tariffs
    description: Duty and tariff rate lookup by HS code with customer-specific overrides
  - name: TMS Organizations
    description: TMS organization management - CRUD and bulk JSONL import

paths:
  /api/v1/external/auth/token:
    post:
      tags: [Authentication]
      summary: Get OAuth access token
      description: |
        Obtain an access token using OAuth 2.0 client credentials flow.
        This token is required for all other API endpoints.

        **Rate Limiting**: 100 requests per minute per IP address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              grant_type: client_credentials
              client_id: wove_prod_abc123def456
              client_secret: sk_your_secret_key
              scope: shipments:read documents:read validation:create
      responses:
        '200':
          description: Access token generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: Bearer
                expires_in: 3600
                scope: shipments:read documents:read validation:create
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid client credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/auth/revoke:
    post:
      tags: [Authentication]
      summary: Revoke OAuth token
      description: |
        Revoke an OAuth access token to immediately invalidate it.
        This is useful when a token is compromised or no longer needed.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: |
                    The token to revoke (optional, defaults to current token)
                token_type_hint:
                  type: string
                  enum: [access_token, refresh_token]
                  description: Hint about the token type
      responses:
        '200':
          description: Token revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  revoked: true
                message: Token revoked successfully
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/test/ping:
    get:
      tags: [Testing]
      summary: Test API connectivity
      description: |
        Simple ping endpoint to test API connectivity and authentication.
        Returns basic information about your authenticated session.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ping successful
          headers:
            X-RateLimit-Limit-Minute:
              schema:
                type: integer
              description: Requests per minute limit
            X-RateLimit-Remaining-Minute:
              schema:
                type: integer
              description: Remaining requests this minute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                data:
                  message: pong
                  customerId: '1'
                  clientId: '1014844138697089024'
                  timestamp: '2025-07-12T00:30:05.083Z'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/test/rate-limit-status:
    get:
      tags: [Testing]
      summary: Get rate limit status
      description: |
        Check your current rate limit usage and remaining quota.
        Useful for monitoring your API usage and planning requests.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rate limit status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      limits:
                        type: object
                        properties:
                          perMinute:
                            type: integer
                            example: 60
                          perDay:
                            type: integer
                            example: 10000
                      usage:
                        type: object
                        properties:
                          minute:
                            type: integer
                            example: 5
                          day:
                            type: integer
                            example: 150
                      remaining:
                        type: object
                        properties:
                          minute:
                            type: integer
                            example: 55
                          day:
                            type: integer
                            example: 9850
                      resetTimes:
                        type: object
                        properties:
                          minute:
                            type: string
                            format: date-time
                            example: '2025-07-12T00:32:00.000Z'
                          day:
                            type: string
                            format: date-time
                            example: '2025-07-13T00:00:00.000Z'

  /api/v1/external/test/protected:
    get:
      tags: [Testing]
      summary: Test protected endpoint
      description: |
        Test endpoint that requires authentication and specific scopes.
        Use this to verify that your OAuth token has the correct permissions.
      security:
        - bearerAuth: [shipments:read]
      responses:
        '200':
          description: Access granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Access granted to protected endpoint
                      customerId:
                        type: string
                        example: '1'
                      scopes:
                        type: array
                        items:
                          type: string
                        example: [shipments:read, documents:read]
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/test/api-usage-status:
    get:
      tags: [Testing]
      summary: Get API usage statistics
      description: |
        Get detailed API usage statistics for the current OAuth client.
        Includes daily, monthly, and total usage metrics.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: API usage statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      dailyUsage:
                        type: integer
                        example: 150
                        description: Number of API calls made today
                      monthlyUsage:
                        type: integer
                        example: 4523
                        description: Number of API calls made this month
                      totalUsage:
                        type: integer
                        example: 15234
                        description: Total number of API calls made
                      lastRequest:
                        type: string
                        format: date-time
                        example: '2025-07-12T00:30:05.083Z'
                        description: Timestamp of the last API request
                      averageResponseTime:
                        type: number
                        example: 125.5
                        description: Average response time in milliseconds
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/shipments:
    get:
      tags: [Shipments]
      summary: List shipments
      description: |
        Retrieve a paginated list of shipments for your organization.
        Results are ordered by creation date (newest first).
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, booked, pending, in_transit, delivered, cancelled]
          description: Filter by shipment status
        - name: shipmentType
          in: query
          schema:
            type: string
            enum: [FCL, LCL, Air]
          description: Filter by shipment type
        - name: search
          in: query
          schema:
            type: string
          description: Search shipments by name or ID
      responses:
        '200':
          description: Shipments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ShipmentSummary'
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                            example: 1
                          limit:
                            type: integer
                            example: 20
                          total:
                            type: integer
                            example: 150
                          totalPages:
                            type: integer
                            example: 8
                          hasNext:
                            type: boolean
                            example: true
                          hasPrev:
                            type: boolean
                            example: false

    post:
      tags: [Shipments]
      summary: Create shipment
      description: Create a new shipment in draft status.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
      responses:
        '201':
          description: Shipment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ShipmentDetails'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/shipments/{shipmentId}:
    get:
      tags: [Shipments]
      summary: Get shipment details
      description: Retrieve detailed information about a specific shipment.
      security:
        - bearerAuth: []
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
          description: Unique shipment identifier
      responses:
        '200':
          description: Shipment details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ShipmentDetails'
        '404':
          description: Shipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Shipments]
      summary: Update shipment
      description: Update an existing shipment's details.
      security:
        - bearerAuth: []
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
          description: Unique shipment identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShipmentRequest'
      responses:
        '200':
          description: |
            Shipment updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ShipmentDetails'
        '404':
          description: Shipment not found

    delete:
      tags: [Shipments]
      summary: Delete shipment
      description: Delete a shipment and all associated data.
      security:
        - bearerAuth: []
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
          description: Unique shipment identifier
      responses:
        '204':
          description: Shipment deleted successfully
        '404':
          description: Shipment not found

  /api/v1/external/shipments/{shipmentId}/details:
    get:
      tags: [Shipments]
      summary: Get detailed shipment information
      description: Retrieve comprehensive shipment details including items and containers.
      security:
        - bearerAuth: []
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
          description: Unique shipment identifier
      responses:
        '200':
          description: Detailed shipment information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      shipment:
                        $ref: '#/components/schemas/ShipmentDetails'
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ShipmentItem'
                      containers:
                        type: array
                        items:
                          $ref: '#/components/schemas/Container'
        '404':
          description: Shipment not found

    put:
      tags: [Shipments]
      summary: Update shipment information
      description: |
        Update shipment-level details only. 
        To update containers, packages, or items, use the respective CRUD endpoints:
        - Containers: PUT /shipments/{shipmentId}/containers/{containerId}
        - Packages: PUT /shipments/{shipmentId}/packages/{packageId}
        - Items: PUT /shipments/{shipmentId}/items/{itemId}
      security:
        - bearerAuth: []
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
          description: Unique shipment identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShipmentDetailsRequest'
      responses:
        '200':
          description: Shipment details updated successfully
          content:
