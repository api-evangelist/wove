          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Items per page
        - name: source
          in: query
          schema:
            type: string
            enum: [cw, gf, lw, ns]
          description: Filter by TMS source
        - name: type
          in: query
          schema:
            type: string
          description: Filter by organization type (e.g. consignee, shipper, carrier)
        - name: active
