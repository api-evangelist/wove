  /api/v1/external/webhooks:
    get:
      tags: [Webhooks]
      summary: List webhooks
      description: |
        Retrieve all configured webhooks for your organization.

        ## Webhook Events

        The following events can trigger webhooks:
        - `extraction.completed` - Document extraction successful
        - `extraction.failed` - Document extraction failed
        - `validation.completed` - Cross-validation completed
        - `validation.failed` - Cross-validation failed
        - `merge.completed` - Document merge completed
        - `merge.failed` - Document merge failed
        - `document.uploaded` - New document uploaded
        - `document.deleted` - Document deleted
        - `shipment.created` - Shipment created
        - `shipment.updated` - Shipment updated
        - `source.processing.completed` - Rate sheet source processing completed
        - `source.processing.failed` - Rate sheet source processing failed

        ## Payload Format

        All webhook payloads follow this structure:
        ```json
        {
          "event": "extraction.completed",
          "timestamp": "2024-01-15T10:30:00.000Z",
          "data": { /* event-specific data */ }
        }
        ```

        See the schemas section for detailed payload structures for each event type.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Webhooks retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'

    post:
      tags: [Webhooks]
      summary: Create webhook
      description: |
        Create a new webhook endpoint for receiving notifications.

        ## Example Payloads

        ### extraction.completed
        ```json
        {
          "event": "extraction.completed",
          "timestamp": "2024-01-15T10:30:00.000Z",
          "data": {
            "document": { /* WebhookDocument object */ },
            "entityType": "shipments",
            "entityId": "1014560123456789012"
          }
        }
        ```

        ### validation.completed
        ```json
        {
          "event": "validation.completed",
          "timestamp": "2024-01-15T10:30:00.000Z",
          "data": {
            "jobId": "1014560123456789012",
            "entityId": "1014560123456789012",
            "entityType": "shipments",
            "documents": [ /* array of WebhookDocument objects */ ],
            "validationResult": { /* validation results */ },
            "itemsValidated": 15,
            "issuesFound": 2,
            "completedAt": "2024-01-15T10:30:00.000Z",
            "type": "cross-validation"
          }
        }
        ```
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
            examples:
              allEvents:
                summary: Subscribe to all document events
                value:
                  url: https://your-app.com/webhooks
                  events:
                    - extraction.completed
                    - extraction.failed
                    - validation.completed
                    - validation.failed
                    - merge.completed
                    - merge.failed
                  description: Production webhook for document processing
              extractionOnly:
                summary: Subscribe to extraction events only
                value:
                  url: https://your-app.com/webhooks/extraction
                  events:
                    - extraction.completed
                    - extraction.failed
                  description: Extraction notifications
      responses:
        '201':
          description: Webhook created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Webhook'
                      - type: object
                        properties:
                          secret:
                            type: string
