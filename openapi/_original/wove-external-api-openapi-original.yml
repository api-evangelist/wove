    # Rates Query Schemas
    QueryBankRateQueryRequest:
      type: object
      properties:
        origins:
          type: array
          items:
            type: string
          description: Inland origin codes or region codes (USWC, USEC, etc.) for door moves
          example: ['USWC', 'USCHI']
        destinations:
          type: array
          items:
            type: string
          description: Inland destination codes or region codes for door moves
          example: ['CNSHA', 'CNNBO']
        loadingPorts:
          type: array
          items:
            type: string
          description: Port of loading codes (UN/LOCODE format)
          example: ['CNSHA', 'CNNBO']
        dischargePorts:
          type: array
          items:
            type: string
          description: Port of discharge codes (UN/LOCODE format)
          example: ['USLAX', 'USLGB']
        effectiveDate:
          type: string
          format: date
          description: Filter rates effective on or after this date
        expiryDate:
          type: string
          format: date
          description: Filter rates that haven't expired by this date
        containerType:
          type: string
          enum: [dry, reefer, nor]
          description: Container type filter
        containerSizes:
          type: array
          items:
            type: string
            enum: [20ft, 40ft, 40ft_hc, 45ft]
          description: Container size filter
        carrierCodes:
          type: array
          items:
            type: string
          description: Filter by specific carrier SCAC codes
          example: ['MAEU', 'MSCU', 'COSU']
        commodityType:
          type: string
          description: Filter by commodity type
        limit:
          type: integer
          default: 100
          maximum: 500
          description: Maximum number of rates to return
        offset:
          type: integer
          default: 0
          description: Number of rates to skip for pagination

    QueryBankRateQueryResponse:
      type: object
      properties:
        rates:
          type: array
          items:
            $ref: '#/components/schemas/CombinedRate'
        metadata:
          type: object
          properties:
            totalRates:
              type: integer
              description: Total number of matching rates
            sourcesSearched:
              type: integer
              description: Number of sources searched
            queryTimeMs:
              type: integer
              description: Query execution time in milliseconds

    CombinedRate:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the rate (hash for deduplication)
        placeOfReceipt:
          description: Origin inland point (for pre-carriage)
          allOf:
            - $ref: '#/components/schemas/LocationInfo'
        portOfLoading:
          description: Port of loading
          allOf:
            - $ref: '#/components/schemas/LocationInfo'
        portOfDischarge:
          description: Port of discharge
          allOf:
            - $ref: '#/components/schemas/LocationInfo'
        placeOfDelivery:
          description: Destination inland point (for on-carriage)
          allOf:
            - $ref: '#/components/schemas/LocationInfo'
        viaPorts:
          description: Transshipment ports in order
          type: array
          items:
            $ref: '#/components/schemas/LocationInfo'
        carrierCode:
          type: string
          description: Carrier SCAC code
        carrierName:
          type: string
          description: Carrier display name
        effectiveDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        commodityType:
          type: string
        transitTime:
          type: integer
          description: Transit time in days
        legs:
          description: Rate breakdown by leg (pre-carriage, main, on-carriage)
          type: array
          items:
            $ref: '#/components/schemas/RateLeg'
        containerRates:
          description: Container-specific pricing
          type: array
          items:
            $ref: '#/components/schemas/CombinedContainerRate'
        surcharges:
          description: Applicable surcharges
          type: array
          items:
            $ref: '#/components/schemas/RateSurcharge'
        sourceId:
          type: string
          description: Source ID where this rate originated
        sourceName:
          type: string
          description: Source filename
      required: [id, portOfLoading, portOfDischarge, carrierCode, containerRates, sourceId, sourceName]

    LocationInfo:
      type: object
      properties:
        code:
          type: string
          description: Location code (UN/LOCODE for ports)
          example: 'CNSHA'
        name:
          type: string
          description: Location display name
          example: 'Shanghai'
        type:
          type: string
          enum: [port, city, address, region]
          description: Type of location
      required: [code, type]

    RateLeg:
      type: object
      properties:
        type:
          type: string
          enum: [pre_carriage, main, on_carriage]
          description: Leg type
        origin:
          $ref: '#/components/schemas/LocationInfo'
        destination:
          $ref: '#/components/schemas/LocationInfo'
        mode:
          type: string
          enum: [truck, rail, barge, ocean]
          description: Transport mode for this leg
        rates:
          description: Container rates for this specific leg
          type: array
          items:
            $ref: '#/components/schemas/LegContainerRate'
      required: [type, origin, destination]

    LegContainerRate:
      type: object
      properties:
        containerSize:
          type: string
          enum: [20ft, 40ft, 40ft_hc, 45ft]
        containerType:
          type: string
          enum: [dry, reefer, nor, general]
        amount:
          type: number
          description: Rate amount
        currency:
          type: string
          description: Currency code (ISO 4217)
          example: 'USD'
      required: [containerSize, containerType, amount, currency]

    CombinedContainerRate:
      type: object
      properties:
        containerType:
          type: string
          enum: [dry, reefer, nor]
        containerSize:
          type: string
          enum: [20ft, 40ft, 40ft_hc, 45ft]
        amount:
          type: number
          description: Total combined rate amount
        currency:
          type: string
          example: 'USD'
        breakdown:
          type: object
          properties:
            preCarriage:
              type: number
              description: Pre-carriage portion
            main:
              type: number
              description: Ocean freight portion
            onCarriage:
              type: number
              description: On-carriage portion
          description: Per-leg breakdown of the total amount
      required: [containerType, containerSize, amount, currency]

    RateSurcharge:
      type: object
      properties:
        code:
          type: string
          description: Surcharge code (e.g., BAF, CAF, THC)
          example: 'BAF'
        name:
          type: string
          description: Surcharge display name
          example: 'Bunker Adjustment Factor'
        applicability:
          type: string
          enum: [inclusive, subject_to, not_subject_to, not_applicable]
          description: Whether this surcharge is included in base rate or additional
        basis:
          type: string
          description: Charging basis (e.g., per_container, per_bl, percentage)
          example: 'per_container'
        amount:
          type: number
          description: Default surcharge amount (when not container-specific)
        currency:
          type: string
          example: 'USD'
        containerRates:
          description: Container-specific surcharge amounts
          type: array
          items:
            $ref: '#/components/schemas/SurchargeContainerRate'
        percentage:
          type: number
          description: Percentage-based surcharge (if applicable)
        applicablePorts:
          type: array
          items:
            type: string
          description: Specific ports this surcharge applies to
        effectiveDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
      required: [code, name, applicability]

    SurchargeContainerRate:
      type: object
      properties:
        containerSize:
          type: string
          enum: [20ft, 40ft, 40ft_hc, 45ft]
        containerType:
          type: string
          enum: [dry, reefer, nor, general, all]
        amount:
          type: number
        currency:
          type: string
          example: 'USD'
      required: [containerSize, amount, currency]

    Organization:
      type: object
      description: Organization/company information
      properties:
        name:
          type: string
          description: Organization name
        code:
          type: string
          description: Organization code or identifier
          nullable: true
      required: [name]

    Address:
      type: object
      description: Physical address
      properties:
        street1:
          type: string
          description: Street address line 1
          nullable: true
        street2:
          type: string
          description: Street address line 2
          nullable: true
        city:
          type: string
          description: City name
          nullable: true
        state:
          type: string
          description: State or province
          nullable: true
        postalCode:
          type: string
          description: Postal or ZIP code
          nullable: true
        country:
          type: string
          description: Country code (2-letter ISO)
          nullable: true

  responses:
    UnauthorizedError:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_token:
              summary: Invalid or expired token
              value:
                success: false
                error:
                  code: AUTHENTICATION_ERROR
                  message: Invalid or expired access token
            missing_auth:
              summary: Missing authentication
              value:
                success: false
                error:
                  code: AUTHENTICATION_ERROR
                  message: Authentication required

    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            insufficient_scope:
              summary: Missing required scope
              value:
                success: false
                error:
                  code: AUTHORIZATION_ERROR
                  message: 'Insufficient scope: documents:read required'
            access_denied:
              summary: Access denied to resource
              value:
                success: false
                error:
                  code: AUTHORIZATION_ERROR
                  message: Access denied to this resource

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Resource not found

    BadRequestError:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation_error:
              summary: Validation error
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: Invalid input parameters
                  details:
                    field: shipmentType
                    error: Must be one of FCL, LCL, or Air
            missing_required:
              summary: Missing required field
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: Missing required field
                  details:
                    field: name
                    error: |
                      Field is required
    RateLimitError:
      description: Too many requests
      headers:
        X-RateLimit-Limit-Minute:
          schema:
            type: integer
          description: Requests per minute limit
        X-RateLimit-Remaining-Minute:
          schema:
            type: integer
          description: Remaining requests this minute
        X-RateLimit-Reset-Minute:
          schema:
            type: integer
          description: Unix timestamp when minute limit resets
        X-RateLimit-Limit-Day:
          schema:
            type: integer
          description: Requests per day limit
        X-RateLimit-Remaining-Day:
          schema:
            type: integer
          description: Remaining requests today
        X-RateLimit-Reset-Day:
          schema:
            type: integer
          description: Unix timestamp when daily limit resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMIT_ERROR
              message: Too many requests. Please retry after some time.
              details:
                retryAfter: 60
                limit: 60
                remaining: 0

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: An internal error occurred. Please try again later.

    TmsOrganization:
      type: object
      properties:
        id:
          type: string
          example: '123456789'
        customerId:
          type: string
        source:
          type: string
