        carrierCode:
          type: string
          nullable: true
        address1:
          type: string
          nullable: true
        address2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        mobileNumber:
          type: string
          nullable: true
        faxNumber:
          type: string
