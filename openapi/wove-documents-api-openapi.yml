openapi: 3.2.0
info:
  title: Wove External Documents API
  version: 1.0.0
  description: '# Wove External API Documentation


    The Wove External API allows you to programmatically access document processing, shipment management, and validation capabilities.'
  contact:
    name: Wove API Support
    email: api-support@wove.com
    url: https://docs.wove.com
  license:
    name: Proprietary
    url: https://wove.com/terms
servers:
- url: https://api.wove.com
  description: Production server
- url: https://staging-api.wove.com
  description: Staging server
- url: http://localhost:4000
  description: Development server
security:
- bearerAuth: []
tags:
- name: Documents
  description: Document management within shipments
paths:
  /api/v1/external/shipments/{shipmentId}/documents:
    get:
      tags:
      - Documents
      summary: List shipment documents
      description: Retrieve all documents associated with a specific shipment.
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      - name: includeDeleted
        in: query
        schema:
          type: boolean
        description: Include deleted documents in the response
      - name: documentTypes
        in: query
        schema:
          type: string
        description: Filter by document types (comma-separated)
      - name: status
        in: query
        schema:
          type: string
          enum:
          - uploaded
          - processing
          - completed
          - failed
        description: Filter by document status
      responses:
        '200':
          description: Documents retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'
      operationId: getApiV1ExternalShipmentsByShipmentIdDocuments
      x-operation-id-source: derived
    post:
      tags:
      - Documents
      summary: Upload document
      description: Upload a single document to a shipment.
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
                documentType:
                  type: string
                  description: Document type
                  example: CommercialInvoice
              required:
              - file
      responses:
        '201':
          description: Document uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Document'
                  message:
                    type: string
                    example: Document uploaded successfully and extraction queued
      operationId: postApiV1ExternalShipmentsByShipmentIdDocuments
      x-operation-id-source: derived
  /api/v1/external/shipments/{shipmentId}/documents/{documentId}:
    get:
      tags:
      - Documents
      summary: Get document details
      description: Retrieve detailed information about a specific document.
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      - name: documentId
        in: path
        required: true
        schema:
          type: string
        description: Unique document identifier
      responses:
        '200':
          description: Document details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    allOf:
                    - $ref: '#/components/schemas/Document'
                    - type: object
                      properties:
                        validationItems:
                          type: array
                          items:
                            type: object
                          description: Associated validation items
        '404':
          description: Document not found
      operationId: getApiV1ExternalShipmentsByShipmentIdDocumentsByDocumentId
      x-operation-id-source: derived
    put:
      tags:
      - Documents
      summary: Update document
      description: Update document metadata or type.
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      - name: documentId
        in: path
        required: true
        schema:
          type: string
        description: Unique document identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: Document type
                name:
                  type: string
                  description: Document name
                isSelected:
                  type: boolean
                  description: Whether document is selected
      responses:
        '200':
          description: Document updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Document'
      operationId: putApiV1ExternalShipmentsByShipmentIdDocumentsByDocumentId
      x-operation-id-source: derived
    delete:
      tags:
      - Documents
      summary: Delete document
      description: Delete a document from the system.
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      - name: documentId
        in: path
        required: true
        schema:
          type: string
        description: Unique document identifier
      responses:
        '204':
          description: Document deleted successfully
        '404':
          description: Document not found
      operationId: deleteApiV1ExternalShipmentsByShipmentIdDocumentsByDocumentId
      x-operation-id-source: derived
  /api/v1/external/shipments/{shipmentId}/documents/{documentId}/download:
    get:
      tags:
      - Documents
      summary: Download document
      description: Download the original document file.
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      - name: documentId
        in: path
        required: true
        schema:
          type: string
        description: Unique document identifier
      responses:
        '200':
          description: Document file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Document not found
      operationId: getApiV1ExternalShipmentsByShipmentIdDocumentsByDocumentIdDownload
      x-operation-id-source: derived
  /api/v1/external/shipments/{shipmentId}/documents/{documentId}/extraction:
    get:
      tags:
      - Documents
      summary: Get extraction status
      description: Get the extraction status and results for a document.
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      - name: documentId
        in: path
        required: true
        schema:
          type: string
        description: Unique document identifier
      responses:
        '200':
          description: Extraction status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                        - pending
                        - processing
                        - completed
                        - failed
                      extractedData:
                        type: object
                      confidence:
                        type: number
                      extractedAt:
                        type: string
                        format: date-time
                      extractionMethod:
                        type: string
      operationId: getApiV1ExternalShipmentsByShipmentIdDocumentsByDocumentIdExtraction
      x-operation-id-source: derived
  /api/v1/external/shipments/{shipmentId}/documents/{documentId}/extract:
    post:
      tags:
      - Documents
      summary: Start extraction
      description: Start or restart extraction for a document.
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      - name: documentId
        in: path
        required: true
        schema:
          type: string
        description: Unique document identifier
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reprocess:
                  type: boolean
                  description: Force reprocessing even if already extracted
                fields:
                  type: array
                  items:
                    type: string
                  description: Specific fields to extract
      responses:
        '200':
          description: Extraction started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      jobId:
                        type: string
                      message:
                        type: string
      operationId: postApiV1ExternalShipmentsByShipmentIdDocumentsByDocumentIdExtract
      x-operation-id-source: derived
  /api/v1/external/shipments/{shipmentId}/documents/{documentId}/extracted-data:
    put:
      tags:
      - Documents
      summary: Update extracted data
      description: Manually update the extracted data for a document.
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      - name: documentId
        in: path
        required: true
        schema:
          type: string
        description: Unique document identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: The extracted data
                changes:
                  type: object
                  description: Description of changes made
              required:
              - data
              - changes
      responses:
        '200':
          description: Extracted data updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                  message:
                    type: string
      operationId: putApiV1ExternalShipmentsByShipmentIdDocumentsByDocumentIdExtractedData
      x-operation-id-source: derived
  /api/v1/external/shipments/{shipmentId}/documents/{documentId}/history:
    get:
      tags:
      - Documents
      summary: Get document history
      description: Get the history of changes for a document.
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      - name: documentId
        in: path
        required: true
        schema:
          type: string
        description: Unique document identifier
      responses:
        '200':
          description: Document history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentHistoryEntry'
      operationId: getApiV1ExternalShipmentsByShipmentIdDocumentsByDocumentIdHistory
      x-operation-id-source: derived
  /api/v1/external/shipments/{shipmentId}/documents/validate:
    post:
      tags:
      - Documents
      summary: Validate documents
      description: Validate specific documents within a shipment.
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documentIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
              required:
              - documentIds
      responses:
        '200':
          description: Validation completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                        - valid
                        - errors
                      issues:
                        type: array
                        items:
                          type: object
                      validatedAt:
                        type: string
                        format: date-time
                      documentIds:
                        type: array
                        items:
                          type: string
      operationId: postApiV1ExternalShipmentsByShipmentIdDocumentsValidate
      x-operation-id-source: derived
  /api/v1/external/shipments/{shipmentId}/documents/cross-validate/{jobId}:
    get:
      tags:
      - Documents
      summary: Get cross-validation job status
      description: Check the status and results of a cross-validation job.
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      - name: jobId
        in: path
        required: true
        schema:
          type: string
        description: Unique job identifier
      responses:
        '200':
          description: Cross-validation status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      job:
                        type: object
                        properties:
                          id:
                            type: string
                          status:
                            type: string
                            enum:
                            - pending
                            - processing
                            - completed
                            - failed
                          progress:
                            type: number
                          result:
                            type: object
                            nullable: true
                            properties:
                              validatedFields:
                                type: array
                                items:
                                  type: string
                              issues:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    field:
                                      type: string
                                    message:
                                      type: string
                                    severity:
                                      type: string
                                      enum:
                                      - critical
                                      - warning
                                    suggestion:
                                      type: string
                                      nullable: true
                                    files:
                                      type: array
                                      items:
                                        type: string
                                    documents:
                                      type: array
                                      items:
                                        type: string
                          error:
                            type: string
                            nullable: true
                          createdAt:
                            type: string
                            format: date-time
                          startedAt:
                            type: string
                            format: date-time
                            nullable: true
                          completedAt:
                            type: string
                            format: date-time
                            nullable: true
        '404':
          description: Job not found
      operationId: getApiV1ExternalShipmentsByShipmentIdDocumentsCrossValidateByJobId
      x-operation-id-source: derived
  /api/v1/external/shipments/{shipmentId}/documents/merge/{jobId}:
    get:
      tags:
      - Documents
      summary: Get merge job status
      description: Check the status and results of a document merge operation.
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      - name: jobId
        in: path
        required: true
        schema:
          type: string
        description: Unique job identifier
      responses:
        '200':
          description: Merge status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      job:
                        type: object
                        properties:
                          id:
                            type: string
                          status:
                            type: string
                            enum:
                            - pending
                            - processing
                            - completed
                            - failed
                          progress:
                            type: number
                          result:
                            nullable: true
                          error:
                            type: string
                            nullable: true
                          createdAt:
                            type: string
                            format: date-time
                          startedAt:
                            type: string
                            format: date-time
                            nullable: true
                          completedAt:
                            type: string
                            format: date-time
                            nullable: true
        '404':
          description: Job not found
      operationId: getApiV1ExternalShipmentsByShipmentIdDocumentsMergeByJobId
      x-operation-id-source: derived
  /api/v1/external/shipments/{shipmentId}/documents/cross-validate:
    post:
      tags:
      - Documents
      summary: Cross-validate documents
      description: Create a cross-validation job to check for inconsistencies between documents in a shipment.
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateDocumentsRequest'
      responses:
        '200':
          description: Cross-validation job created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      jobId:
                        type: string
                      message:
                        type: string
        '400':
          description: Invalid request
        '404':
          description: Shipment not found
      operationId: postApiV1ExternalShipmentsByShipmentIdDocumentsCrossValidate
      x-operation-id-source: derived
  /api/v1/external/shipments/{shipmentId}/documents/merge:
    post:
      tags:
      - Documents
      summary: Merge shipment documents
      description: 'Create a job to merge data from multiple documents within a shipment.

        Intelligently combines data from related documents (e.g., commercial invoice and packing list).'
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeDocumentsRequest'
      responses:
        '200':
          description: Merge job created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/MergeJobResponse'
        '400':
          description: Invalid request or documents not found
        '404':
          description: Shipment not found
      operationId: postApiV1ExternalShipmentsByShipmentIdDocumentsMerge
      x-operation-id-source: derived
  /api/v1/external/shipments/{shipmentId}/documents/analyze-types:
    post:
      tags:
      - Documents
      summary: Analyze document types
      description: 'Analyze a document to detect multiple document types within it.

        For PDFs, this will identify different document types and their page boundaries.

        For other file types, it will identify the document type based on content.'
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The document file to analyze
              required:
              - file
      responses:
        '200':
          description: Document analysis completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      types:
                        type: array
                        description: Array of detected document types and their boundaries
                        items:
                          type: object
                          properties:
                            documentType:
                              type: string
                              description: Type of document detected
                              enum:
                              - CommercialInvoice
                              - PackingList
                              - BillOfLading
                              - AirWaybill
                              - CertificateOfOrigin
                              - DangerousGoodsDeclaration
                              - Other
                            startPage:
                              type: integer
                              nullable: true
                              description: Starting page number (1-indexed) for PDFs
                            endPage:
                              type: integer
                              nullable: true
                              description: Ending page number (1-indexed) for PDFs
                            confidence:
                              type: string
                              enum:
                              - high
                              - medium
                              - low
                              description: Confidence level of the detection
                      totalPages:
                        type: integer
                        description: Total number of pages in the document (for PDFs)
                      requiresSplit:
                        type: boolean
                        description: Whether the document contains multiple types requiring split
        '400':
          description: Invalid file or request
        '404':
          description: Shipment not found
        '413':
          description: File too large
      operationId: postApiV1ExternalShipmentsByShipmentIdDocumentsAnalyzeTypes
      x-operation-id-source: derived
  /api/v1/external/shipments/{shipmentId}/documents/upload-multi:
    post:
      tags:
      - Documents
      summary: Upload multi-document file
      description: 'Upload a file containing multiple documents.

        For PDFs with multiple document types, this will create separate document records for each type.

        The original file is stored once, with virtual splits created for each document type.'
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
        description: Unique shipment identifier
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The document file to upload
                types:
                  type: string
                  description: JSON string containing array of document types with page ranges
                  example: '[{"documentType":"BillOfLading","startPage":1,"endPage":2},{"documentType":"CommercialInvoice","startPage":3,"endPage":4}]'
              required:
              - file
              - types
      responses:
        '200':
          description: Documents uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      documents:
                        type: array
                        description: Array of created document records
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Document ID
                            type:
                              type: string
                              description: Document type
                            name:
                              type: string
                              description: Generated document name
                            startPage:
                              type: integer
                              nullable: true
                              description: Start page for split documents
                            endPage:
                              type: integer
                              nullable: true
                              description: End page for split documents
                            isSplit:
                              type: boolean
                              description: Whether this is a split document
        '400':
          description: Invalid file or types specification
        '404':
          description: Shipment not found
        '413':
          description: File too large
      operationId: postApiV1ExternalShipmentsByShipmentIdDocumentsUploadMulti
      x-operation-id-source: derived
  /api/v1/external/entities/{entityType}/{entityId}/documents:
    get:
      tags:
      - Documents
      summary: List entity documents
      description: 'Retrieve all documents associated with a specific entity.

        Supports any entity type (shipment, rfq_shipment, etc.).'
      security:
      - bearerAuth: []
      parameters:
      - name: entityType
        in: path
        required: true
        schema:
          type: string
          enum:
          - shipment
          - rfq_shipment
        description: Type of entity
      - name: entityId
        in: path
        required: true
        schema:
          type: string
        description: Entity ID
      - name: includeDeleted
        in: query
        schema:
          type: boolean
        description: Include deleted documents
      - name: documentTypes
        in: query
        schema:
          type: string
        description: Comma-separated list of document types to filter
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
        description: Filter by document status
      responses:
        '200':
          description: Documents retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'
        '404':
          description: Entity not found
      operationId: getApiV1ExternalEntitiesByEntityTypeByEntityIdDocuments
      x-operation-id-source: derived
    post:
      tags:
      - Documents
      summary: Upload document to entity
      description: 'Upload a single document and attach it to an entity.

        Document type can be auto-detected or explicitly specified.'
      security:
      - bearerAuth: []
      parameters:
      - name: entityType
        in: path
        required: true
        schema:
          type: string
          enum:
          - shipment
          - rfq_shipment
        description: Type of entity
      - name: entityId
        in: path
        required: true
        schema:
          type: string
        description: Entity ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file to upload
                documentType:
                  type: string
                  description: Document type (optional, will be auto-detected if not provided)
      responses:
        '201':
          description: Document uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Document'
                  message:
                    type: string
        '400':
          description: Invalid file or parameters
        '404':
          description: Entity not found
      operationId: postApiV1ExternalEntitiesByEntityTypeByEntityIdDocuments
      x-operation-id-source: derived
  /api/v1/external/entities/{entityType}/{entityId}/documents/multi:
    post:
      tags:
      - Documents
      summary: Upload multi-document PDF
      description: 'Upload a single PDF file containing multiple documents.

        The system will automatically split and classify each document.'
      security:
      - bearerAuth: []
      parameters:
      - name: entityType
        in: path
