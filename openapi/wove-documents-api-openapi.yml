  /api/v1/external/documents/guess-type:
    post:
      tags:
      - Documents
      summary: Guess document type
      description: 'Intelligently guess the type of a document based on its filename and optionally its content.

        Uses AI-powered detection to analyze filename patterns and file content for accurate type identification.


        **File size limit**: 50MB when uploading file content


        **Supported file types for content analysis**:

        - Images (JPEG, PNG, etc.)

        - PDFs

        - Spreadsheets (Excel, CSV)

        - Word documents (DOCX)'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fileName:
                  type: string
                  description: The name of the file to analyze
                  example: Packing_List_ABC.xlsx
                file:
                  type: string
                  format: binary
                  description: Optional file content for more accurate type detection
              required:
              - fileName
      responses:
        '200':
          description: Document type guessed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      documentType:
                        type: string
                        description: The detected document type
                        enum:
                        - CommercialInvoice
                        - PackingList
                        - BillOfLading
                        - AirWaybill
                        - CertificateOfOrigin
                        - DangerousGoodsDeclaration
                        - InsuranceCertificate
                        - SafetyDataSheet
                        - BookingConfirmation
                        - APInvoice
                        - ARInvoice
                        - PaymentConfirmation
                        - ISFFiling
                        - Other
                        example: CommercialInvoice
                      confidence:
                        type: string
                        description: Confidence level of the detection
                        enum:
                        - high
                        - low
                        example: high
                      fileName:
                        type: string
                        description: The analyzed filename
                        example: Commercial_Invoice_123.pdf
                      fileAnalyzed:
                        type: boolean
                        description: Whether file content was analyzed (in addition to filename)
                        example: false
              example:
                success: true
                data:
                  documentType: CommercialInvoice
                  confidence: high
                  fileName: Commercial_Invoice_123.pdf
                  fileAnalyzed: false
        '400':
          description: Bad request - missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: BAD_REQUEST
                  message: fileName is required
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: FORBIDDEN
                  message: 'Insufficient scope: documents:read required'
      operationId: postApiV1ExternalDocumentsGuessType
      x-operation-id-source: derived
components:
  schemas:
    MergeJobResponse:
      type: object
      properties:
        jobId:
          type: string
          example: '1014851234567890123'
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
          example: pending
        documentIds:
          type: array
          items:
            type: string
        message:
          type: string
          example: Merge job created. Use the job ID to check status.
    MergeDocumentsRequest:
      type: object
      properties:
        documentIds:
          type: array
          items:
            type: string
          minItems: 2
      required:
      - documentIds
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid input parameters
            details:
              type: object
              description: Additional error context
      required:
      - success
      - error
    Document:
      type: object
      properties:
        id:
          type: string
          example: '1013737064058920960'
        entityId:
          type: string
          example: '1014810279825727490'
        entityType:
          type: string
          example: shipment
        type:
          type: string
          example: CommercialInvoice
        name:
          type: string
          example: commercial_invoice.pdf
        size:
          type: integer
          example: 1024000
        checksum:
          type: string
          example: a1b2c3d4e5f6...
        isSelected:
          type: boolean
          example: true
        extractedData:
          type: object
          description: Extracted data from the document
          additionalProperties: true
        extractionStatus:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
          example: completed
        extractionError:
          type: string
          example: null
        extractedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ValidateDocumentsRequest:
      type: object
      properties:
        documentIds:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - documentIds
    DocumentHistoryEntry:
      type: object
      properties:
        type:
          type: string
          example: edit
        source:
          type: string
          example: manual
        date:
          type: string
          format: date-time
        changes:
          type: object
          additionalProperties: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 Bearer token obtained from /auth/token endpoint
